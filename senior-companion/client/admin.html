<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>Persona-Designer</title>
<meta name="theme-color" content="#4A5D52">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<header class="admin-topbar">
  <h1>Persona-Designer</h1>
  <button id="logoutBtn" class="admin-btn admin-btn-secondary" hidden>Abmelden</button>
</header>

<main id="loginView" class="admin-login">
  <form id="loginForm">
    <label>
      Admin-Token
      <input type="password" id="tokenInput" required autocomplete="current-password">
    </label>
    <button type="submit" class="admin-btn admin-btn-primary">Anmelden</button>
    <p id="loginError" class="admin-banner admin-banner-error" hidden></p>
  </form>
</main>

<main id="appView" hidden>
  <section id="listView">
    <div class="admin-list-actions">
      <button id="newPersonaBtn" class="admin-btn admin-btn-primary">+ Neue Persona anlegen</button>
    </div>
    <p id="warningsBanner" class="admin-banner admin-banner-warning" hidden></p>
    <div id="personaCards" class="admin-cards"></div>
  </section>

  <section id="formView" hidden>
    <h2 id="formHeading"></h2>
    <p id="formError" class="admin-banner admin-banner-error" hidden></p>
    <form id="personaForm">
      <label>
        ID
        <input type="text" id="idInput" pattern="[a-z][a-z0-9_]{1,31}"
               title="Kleinbuchstaben, Ziffern, Unterstrich, 2-32 Zeichen">
        <span id="idReadonly" class="admin-readonly" hidden></span>
      </label>
      <label>
        Modell
        <span class="admin-select-with-link">
          <select id="modelInput" required></select>
          <a href="https://ollama.com/library" target="_blank" rel="noopener" class="admin-external-link">weitere Modelle suchen ↗</a>
        </span>
      </label>
      <label class="admin-checkbox-label">
        <input type="checkbox" id="alwaysLoadedInput">
        Immer geladen
      </label>
      <label>
        Max. Tokens
        <input type="number" id="maxTokensInput" min="1" max="4096" required>
      </label>
      <label>
        Neigung, das Gespräch zurückzuholen (0 = zurückhaltend, 1 = fragt oft nach)
        <span class="admin-range-row">
          <input type="range" id="reengagementInput" min="0" max="1" step="0.05">
          <output id="reengagementOutput"></output>
        </span>
      </label>
      <div class="admin-color-row">
        <label>
          Farbe
          <input type="color" id="colorInput">
        </label>
        <label>
          Hintergrundfarbe
          <input type="color" id="backgroundColorInput">
        </label>
        <div id="colorPreview" class="avatar-shape-bg admin-color-preview"></div>
      </div>

      <label>
        Vorname
        <input type="text" id="firstNameInput" required>
      </label>
      <label>
        Nachname
        <input type="text" id="lastNameInput">
      </label>
      <label>
        Titel
        <input type="text" id="titleInput" placeholder="z.B. Professor">
      </label>
      <label>
        Geschlecht
        <select id="genderInput">
          <option value="neutral">Neutral</option>
          <option value="weiblich">Weiblich</option>
          <option value="maennlich">Männlich</option>
        </select>
      </label>
      <label>
        Anrede-Voreinstellung
        <select id="defaultAnredeInput">
          <option value="sie">Sie</option>
          <option value="du">Du</option>
        </select>
      </label>
      <label>
        Stimme
        <span class="admin-select-with-link">
          <select id="voiceIdInput" required></select>
          <a href="https://huggingface.co/rhasspy/piper-voices" target="_blank" rel="noopener" class="admin-external-link">weitere Stimmen suchen ↗</a>
        </span>
      </label>
      <!-- Nur sichtbar, wenn die aktuell gewaehlte Stimme mehrere
           Sprecher in einer Datei buendelt (z.B. de_DE-mls-medium) -
           siehe refreshSpeakerOptions() in admin.js. -->
      <label id="voiceSpeakerIdField" hidden>
        Sprecher (Mehrsprecher-Stimme)
        <select id="voiceSpeakerIdInput"></select>
      </label>
      <label>
        Masterprompt
        <textarea id="systemPromptInput" rows="8" required></textarea>
      </label>
      <span class="avatar-shape-bg admin-color-preview" id="facePreview"></span>
      <div id="faceFieldsContainer"></div>

      <details class="admin-narrative-fields">
        <summary>Weitere Felder (noch ohne Wirkung im Gespräch)</summary>
        <label>Langzeitagenda
          <textarea id="longTermAgendaInput" rows="3"></textarea>
        </label>
        <label>Tagesagenda
          <textarea id="dailyAgendaInput" rows="3"></textarea>
        </label>
        <label>Eigene Geschichte
          <textarea id="ownBackstoryInput" rows="3"></textarea>
        </label>
        <label>Eigene Interessen
          <textarea id="ownInterestsInput" rows="3"></textarea>
        </label>
        <label>Verwandtschaft (Eltern, Geschwister, ...)
          <textarea id="familyRelationsInput" rows="3"></textarea>
        </label>
      </details>

      <div class="admin-form-actions">
        <button type="submit" class="admin-btn admin-btn-primary">Speichern</button>
        <button type="button" id="cancelFormBtn" class="admin-btn admin-btn-secondary">Abbrechen</button>
      </div>
    </form>
  </section>
</main>

<script src="js/admin.js"></script>
</body>
</html>
